<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEUBAT Wiki</title>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #141b2a;
      --surface-2: #1e2740;
      --text: #e6edf7;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --border: #283350;
      --term: #f472b6;
      --ok: #34d399;
      --warn: #fbbf24;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    #app {
      display: grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "header header"
        "sidebar main"
        "footer footer";
      min-height: 100vh;
    }

    header {
      grid-area: header;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
    }

    .brand-logo {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center;
      color: #fff; font-weight: 800;
    }

    .search {
      position: relative;
      flex: 1;
      max-width: 420px;
    }

    .search input {
      width: 100%;
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    .search input:focus { border-color: var(--accent); }

    .search-results {
      position: absolute;
      top: 110%;
      left: 0; right: 0;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 260px;
      overflow-y: auto;
      display: none;
    }

    .search-results.active { display: block; }

    .search-results button {
      width: 100%;
      text-align: left;
      padding: 0.6rem 0.9rem;
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      border-bottom: 1px solid var(--border);
    }

    .search-results button:hover { background: rgba(56,189,248,0.08); }

    .search-results .res-category {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.15rem;
    }

    aside {
      grid-area: sidebar;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1rem;
      overflow-y: auto;
    }

    .nav-group { margin-bottom: 1.25rem; }
    .nav-group-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .nav-link {
      display: block;
      padding: 0.45rem 0.65rem;
      border-radius: 6px;
      color: var(--text);
      margin-bottom: 0.15rem;
    }

    .nav-link:hover, .nav-link.active {
      background: var(--surface-2);
      text-decoration: none;
    }

    main {
      grid-area: main;
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    h1, h2, h3 { color: var(--text); margin-top: 0; }
    h1 { font-size: 2rem; border-bottom: 2px solid var(--accent); padding-bottom: 0.4rem; }
    h2 { font-size: 1.45rem; margin-top: 2rem; color: var(--accent); }
    h3 { font-size: 1.15rem; margin-top: 1.5rem; color: var(--accent-2); }

    p { margin: 0.8rem 0; }

    ul, ol { padding-left: 1.4rem; }
    li { margin: 0.35rem 0; }

    code {
      background: var(--surface-2);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-family: "Fira Code", Consolas, monospace;
      font-size: 0.9em;
    }

    pre {
      background: var(--surface-2);
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid var(--border);
    }

    pre code { background: transparent; padding: 0; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.95rem;
    }

    th, td {
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      text-align: left;
    }

    th { background: var(--surface-2); color: var(--accent); }

    .term {
      color: var(--term);
      border-bottom: 1px dashed var(--term);
      cursor: help;
      position: relative;
    }

    .term abbr { text-decoration: none; color: inherit; }

    .tag {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      background: var(--surface-2);
      color: var(--text-muted);
      margin-right: 0.35rem;
    }

    .tag.ok { background: rgba(52,211,153,0.15); color: var(--ok); }
    .tag.warn { background: rgba(251,191,36,0.15); color: var(--warn); }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
    }

    .card h3 { margin-top: 0; }

    footer {
      grid-area: footer;
      padding: 1rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    #tooltip {
      position: fixed;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      max-width: 320px;
      font-size: 0.88rem;
      line-height: 1.4;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 100;
    }

    #tooltip.visible { opacity: 1; }
    #tooltip strong { color: var(--accent); display: block; margin-bottom: 0.25rem; }

    @media (max-width: 800px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto 1fr auto;
        grid-template-areas:
          "header"
          "sidebar"
          "main"
          "footer";
      }
      aside { border-right: none; border-bottom: 1px solid var(--border); }
      main { padding: 1rem; }
      header { flex-wrap: wrap; }
      .search { order: 3; max-width: 100%; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <a href="/" class="brand">
        <div class="brand-logo">N</div>
        <span>NEUBAT Wiki</span>
      </a>
      <div class="search">
        <input id="searchInput" type="text" placeholder="Buscar artículos, términos..." autocomplete="off" />
        <div id="searchResults" class="search-results"></div>
      </div>
    </header>

    <aside id="sidebar"></aside>

    <main id="content"></main>

    <footer>
      NEUBAT v1.0.0 · Documentación viva generada desde el repositorio · <a href="https://github.com/Soluciones-Alexendros/neubat">GitHub</a>
    </footer>
  </div>

  <div id="tooltip"></div>

  <script>

      "Jest": "Framework de testing para JavaScript mantenido por Meta.",
      "bats": "Bash Automated Testing System. Framework de tests para scripts Bash.",

      "nginx": "Servidor web/proxy inverso de alto rendimiento."

    const categories = [
      {
        title: "General",
        items: [

            <tr><td><code>50-firstboot-ansible.sh</code></td><td>5</td><td>Preparar post-instalación <span class="term">Ansible</span></td></tr>
            <tr><td><code>neubat-install.sh</code></td><td>orquestador</td><td>Script maestro que carga los módulos</td></tr>

          <h2>Utilidades compartidas</h2>
          <p><code>scripts/lib/utils.sh</code> exporta <code>part_name()</code> y <code>cfg_get()</code>, testeadas con <span class="term">bats</span>.</p>

      },
      ipxe: {

          <h2>Kernel cmdline</h2>
          <pre><code>archiso_http_srv=&lt;url&gt;/arch/ ip=dhcp neubat_token=&lt;token&gt; neubat_profile=&lt;perfil&gt;</code></pre>

          <h2>Fallback</h2>
          <p><code>netboot/grub/loopback.cfg</code> permite arrancar la <span class="term">ISO</span> desde disco mediante <span class="term">GRUB</span> loopback.</p>
        `
      },

    function escapeRegExp(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function enrichText(html) {
      const keys = Object.keys(terms).sort((a, b) => b.length - a.length);
      keys.forEach(term => {
        const re = new RegExp(`(?<!<[^>]*)\\b(${escapeRegExp(term)})\\b`, 'gi');
        html = html.replace(re, `<span class="term" data-term="${term}">$1</span>`);
      });
      return html;
    }

    function renderArticle(id) {
      const article = articles[id];
      if (!article) return;
      document.getElementById('content').innerHTML = `
        <h1>${article.title}</h1>
        ${enrichText(article.body)}
      `;
      document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
      const active = document.querySelector(`.nav-link[data-id="${id}"]`);
      if (active) active.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      attachTooltips();
    }

    function renderSidebar() {
      const sb = document.getElementById('sidebar');
      sb.innerHTML = categories.map(cat => `
        <div class="nav-group">
          <div class="nav-group-title">${cat.title}</div>
          ${cat.items.map(item => `<a href="#${item.id}" class="nav-link" data-id="${item.id}">${item.title}</a>`).join('')}
        </div>
      `).join('');

      sb.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', e => {
          e.preventDefault();
          const id = link.getAttribute('data-id');
          renderArticle(id);
          history.pushState({ id }, '', `#${id}`);
        });
      });
    }

    function attachTooltips() {
      const tooltip = document.getElementById('tooltip');
      document.querySelectorAll('.term').forEach(el => {
        const term = el.getAttribute('data-term');
        const def = terms[term];
        if (!def) return;

        el.addEventListener('mouseenter', () => {
          tooltip.textContent = '';
          const strong = document.createElement('strong');
          strong.textContent = term;
          tooltip.appendChild(strong);
          tooltip.appendChild(document.createTextNode(def));
          tooltip.classList.add('visible');
        });

        el.addEventListener('mousemove', e => {
          const x = e.clientX + 12;
          const y = e.clientY + 12;
          const rect = tooltip.getBoundingClientRect();
          tooltip.style.left = Math.min(x, window.innerWidth - rect.width - 8) + 'px';
          tooltip.style.top = Math.min(y, window.innerHeight - rect.height - 8) + 'px';
        });

        el.addEventListener('mouseleave', () => {
          tooltip.classList.remove('visible');
        });
      });
    }

    function setupSearch() {
      const input = document.getElementById('searchInput');
      const results = document.getElementById('searchResults');

      function getIndex() {
        const list = [];
        Object.entries(articles).forEach(([id, art]) => {
          list.push({ id, title: art.title, category: 'Artículo', text: art.body.replace(/<[^>]+>/g, ' ') });
        });
        Object.entries(terms).forEach(([term, def]) => {
          list.push({ id: 'terminologia', title: term, category: 'Término', text: def });
        });
        return list;
      }

      input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        results.innerHTML = '';
        if (!q) { results.classList.remove('active'); return; }

        const matches = getIndex().filter(item =>
          item.title.toLowerCase().includes(q) || item.text.toLowerCase().includes(q)
        ).slice(0, 8);

        if (matches.length === 0) {
          results.innerHTML = '<button disabled>Sin resultados</button>';
        } else {
          results.innerHTML = matches.map(m => `
            <button data-target="${m.id}">
              <div class="res-category">${m.category}</div>
              <div>${m.title}</div>
            </button>
          `).join('');
        }
        results.classList.add('active');

        results.querySelectorAll('button[data-target]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-target');
            renderArticle(id);
            history.pushState({ id }, '', `#${id}`);
            input.value = '';
            results.classList.remove('active');
          });
        });
      });

      document.addEventListener('click', e => {
        if (!e.target.closest('.search')) results.classList.remove('active');
      });
    }

    window.addEventListener('popstate', e => {
      const id = (e.state && e.state.id) || location.hash.slice(1) || 'inicio';
      renderArticle(id);
    });

    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar();
      setupSearch();
      const initial = location.hash.slice(1) || 'inicio';
      renderArticle(initial);
    });
  </script>
