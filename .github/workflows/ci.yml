name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            portal/package-lock.json
            portal/frontend/package-lock.json

      - name: Install portal dependencies
        run: cd portal && npm ci

      - name: Install frontend dependencies
        run: cd portal/frontend && npm ci

      - name: Install shellcheck and Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ansible
          pip3 install ansible-lint --break-system-packages || pip3 install ansible-lint

      - name: Validate scripts and configs
        run: make validate

      - name: Lint shell and frontend
        run: make lint

      - name: Validate Ansible
        run: make test-ansible

  test:
    name: test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            portal/package-lock.json
            portal/frontend/package-lock.json

      - name: Install portal dependencies
        run: cd portal && npm ci

      - name: Install frontend dependencies
        run: cd portal/frontend && npm ci

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run portal tests
        run: make test

      - name: Run frontend tests
        run: cd portal/frontend && npm test

      - name: Run bats tests
        run: make test-bash

  p0-tests:
    name: p0-tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install portal dependencies
        run: cd portal && npm ci

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run P0 security tests
        run: make test-p0

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd portal/frontend && npm ci

      - name: Build frontend for production
        run: make build-frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neubat-frontend
          path: |
            portal/public/index.html
            portal/public/assets/
            portal/public/favicon.svg
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install portal dependencies
        run: cd portal && npm ci

      - name: API smoke (health + install)
        run: make smoke

  e2e:
    name: e2e (Playwright)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            portal/package-lock.json
            portal/frontend/package-lock.json
            portal/e2e/package-lock.json

      - name: Install portal dependencies
        run: cd portal && npm ci

      - name: Install frontend dependencies
        run: cd portal/frontend && npm ci

      - name: Install e2e dependencies
        run: cd portal/e2e && npm ci

      - name: Install Playwright Chromium
        run: cd portal/e2e && npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: make test-e2e
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            portal/e2e/playwright-report/
            portal/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  provenance:
    name: provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: neubat-frontend
          path: frontend-dist

      - name: Attest frontend build
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: frontend-dist/**
